name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No dependencies to install: scripts and tests use the Node standard library.
      - name: Validate template structure
        run: npm run check

      - name: Fail if the legacy export is stale
        run: |
          npm run build
          git diff --exit-code build/ \
            || (echo "build/legacy is stale — run 'npm run build' and commit"; exit 1)

      - name: Validate the reference implementations
        run: npm run validate:reference

      - name: Test
        run: npm test
